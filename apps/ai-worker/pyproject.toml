[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "jmos-worker"
version = "0.1.0"
description = "Jansen Marketing OS local AI Worker: durable queue consumer (docs/08)."
requires-python = ">=3.12"
# Exact pins: this is an application, and CI must be reproducible.
dependencies = [
  "psycopg[binary]==3.3.6",
  "jsonschema==4.26.0",
  # Service-account JWT signing for the Drive connector (ADR 0004).
  "cryptography==50.0.2",
]

[project.optional-dependencies]
# Local transcription (docs/08 §3). Heavy (CTranslate2): installed only on the worker machine.
transcription = [
  "faster-whisper==1.1.1",
]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.9",
  "mypy==2.3.1",
  "types-jsonschema==4.26.0.20260518",
]

[project.scripts]
jmos-worker = "jmos_worker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jmos_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Integration tests need a database; `pnpm test:integration` runs them with `-m integration`.
addopts = ["--strict-markers", "-m", "not integration"]
markers = ["integration: needs a Postgres database (run through `pnpm test:integration`)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "BLE", "RUF", "PT", "C4", "RET"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
